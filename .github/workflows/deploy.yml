name: Docs release
on:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: docs-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    uses: ./.github/workflows/docs.yml
    with:
      release: ${{ github.event_name == 'release' }}
  publish:
    if: github.event_name == 'release'
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    environment: documentation
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docs-distribution
          path: artifacts
      - name: Verify and attach the prepared documentation
        working-directory: artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS
          gh release upload "$RELEASE_TAG" ./*.tar.gz docs-release.json SHA256SUMS
