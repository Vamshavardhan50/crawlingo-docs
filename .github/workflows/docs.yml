name: Docs CI
on:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docs:
    name: Documentation build and distribution
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Read audited engine commit
        if: inputs.release
        id: snapshot
        run: node -e "require('fs').appendFileSync(process.env.GITHUB_OUTPUT, 'commit=' + require('./src/content/generated/sdk-api.json').sourceCommit + '\n')"
      - uses: actions/checkout@v4
        if: inputs.release
        with:
          repository: Vamshavardhan50/crawlingo
          ref: ${{ steps.snapshot.outputs.commit }}
          path: .engine
      - uses: actions/setup-python@v5
        if: inputs.release
        with:
          python-version: '3.12'
      - name: Install source-inventory compiler
        if: inputs.release
        working-directory: .engine/sdk/nodejs
        run: npm ci --ignore-scripts
      - name: Require exact release provenance
        if: inputs.release
        run: npm run check:api -- --release
        env:
          DOCS_RELEASE_TAG: ${{ github.event.release.tag_name }}
          DOCS_RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
      - run: npm run build -- --webpack
      - run: npm run package:docs
      - uses: actions/upload-artifact@v4
        with:
          name: docs-distribution
          path: |
            artifacts/*.tar.gz
            artifacts/docs-release.json
            artifacts/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
